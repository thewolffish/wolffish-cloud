# Packaging — intentionally absent in Wolffish Cloud.
#
# This app is dev-only: it runs with `npm run dev` and is never packaged,
# signed, or released from this repo. Distribution belongs to each client
# fork's own deployment workflow, under their own identity and keys.
#
# When wiring a client fork's build, this file is the place to do it.
# What a working config needs (see thewolffish/wolffish-app for a complete
# reference implementation):
#
#   appId: <client reverse-domain id, e.g. com.acme.agent>
#   productName: <client app name>
#   directories.buildResources: build   # icons + entitlements live there
#   files/asarUnpack rules for native modules (better-sqlite3)
#   mac: hardened runtime + entitlements + notarization (client Apple ID)
#   win: signing cert (client's), NSIS installer settings
#   linux: AppImage/deb targets
#   publish: the client's update feed (pairs with a self-updater the fork
#            brings back — upstream's src/main/updater.ts is the reference;
#            this repo carries none)
#
# electron-builder itself stays installed because `install-app-deps`
# rebuilds native modules for Electron during `npm install` — which is why
# the two identity keys below exist: install-app-deps requires a non-empty
# config. They are deliberately distinct from the personal app's identity
# (sh.wolffi.app / "Wolffish") so nothing ever collides with it.

appId: cloud.wolffi.sh
productName: Wolffish Cloud
