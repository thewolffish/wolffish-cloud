# The foundation's gate: every push and pull request typechecks both apps and
# runs the desktop's seam tests (sync engine, capability mirror, channel
# settings table, usage ledger) — the suites that need no network and no
# Cloudflare account. The API's smoke suites need `wrangler dev` plus the mock
# hosts and stay a local step (`npm test` in apps/api); the live gate
# (scripts/verify-live.mjs) runs after every deploy by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api · typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  desktop:
    name: desktop · typecheck + seam tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: seam tests
        run: |
          set -e
          for t in \
            src/main/cloud/__tests__/config-lww.test.ts \
            src/main/cloud/__tests__/restore-second-device.test.ts \
            src/main/cloud/__tests__/capability-sync.test.ts \
            src/main/cloud/__tests__/purge-cycle.test.ts \
            src/main/runtime/__tests__/usage-brave.test.ts \
            src/main/runtime/__tests__/vision.test.ts \
            src/main/channels/__tests__/mobile-channel-settings.test.ts \
            src/main/channels/__tests__/channel-status.test.ts \
            src/main/__tests__/media-url.test.ts \
            src/main/__tests__/conversation-titler.test.ts; do
            echo "━━━ $t"
            npx tsx --tsconfig tsconfig.node.json "$t"
          done
